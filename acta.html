<style>
:root{
  --paper:#F4F5F7;
  --sheet:#FFFFFF;
  --ink:#1C1E22;
  --ink-2:#454A52;
  --muted:#6B7076;
  --rule-2:#D3D8DE;
  --pick:#0E8F9E;  --pick-bg:#DCEFF1;
  --dep:#6E4BD6;   --dep-bg:#E7E1FA;
  --shadow:0 1px 2px rgba(38,38,42,.05),0 12px 26px -20px rgba(38,38,42,.55);
  --rule:#E3E6EA;
  --rule-hard:#C9CED5;
  --accent:#2FB5EE;
  --off:#FFFFFF;
  --ease:cubic-bezier(.2,0,0,1);
  --f-display:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pick-fg:#0A6C77;
  --dep-fg:#4F31A8;
  --row-hover:#F1F3F5;
  --invert-bg:#1C1E22; --invert-fg:#F4F5F7;
  --mark-fg:#1C1E22;
  --wm:rgba(38,38,42,.05);
  --ok-bg:#DCEDE5;  --ok-fg:#256B51;
  --go-bg:#D6EEFA;  --go-fg:#15688E;
  --wait-bg:#FAE6C4;--wait-fg:#87590C;
  --bad-bg:#F7DAD5; --bad-fg:#8E2F1E;
  --sig-blue:#1E7FB8;
  --sig-orange:#C2681A;
  --sig-green:#1C7A3E;
  --sig-red:#B8352A;
  --sig-gray:#5A574F;
  --chip-fg:#FFFFFF;
  --th-bg:#1C1E22;  --th-fg:#F4F5F7;
  color-scheme:light;
}

/* ---------- modo oscuro: pasos propios, validados contra el fondo oscuro ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --paper:#131519;
  --paper-2:#1B1E24;
  --raised:#22262D;
  --sheet:#1A1D23;
  --off:#1B1E24;
  --ink:#E9ECEF;
  --ink-2:#B6BCC4;
  --muted:#878E98;
  --rule:#272B32;
  --rule-hard:#454C56;
  --rule-2:#343941;
  --amber:#F2A63C;
  --accent:#57C4F2;
  --green:#4FB894;
  --pick:#25A2B1;   --pick-bg:#10333A;  --pick-fg:#7FDCE8;
  --dep:#9575EC;    --dep-bg:#251E3E;   --dep-fg:#C6B1FF;
  --sig-blue:#3C9ED2;
  --sig-orange:#C87C2E;
  --sig-green:#3DA35F;
  --sig-red:#D9544A;
  --sig-gray:#868C94;
  --chip-fg:#12141A;
  --th-bg:#1F232A;  --th-fg:#C9CFD6;
  --ok-bg:#16302A;  --ok-fg:#74D6AE;
  --go-bg:#10303F;  --go-fg:#72C9EE;
  --wait-bg:#3A2C12;--wait-fg:#EBB763;
  --bad-bg:#3B1D18; --bad-fg:#F2958A;
  --row-hover:#20242A;
  --invert-bg:#0E0F12; --invert-fg:#E9ECEF;
  --mark-fg:#15171C;
  --wm:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 32px -22px rgba(0,0,0,.95);
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131519;
  --paper-2:#1B1E24;
  --raised:#22262D;
  --sheet:#1A1D23;
  --off:#1B1E24;
  --ink:#E9ECEF;
  --ink-2:#B6BCC4;
  --muted:#878E98;
  --rule:#272B32;
  --rule-hard:#454C56;
  --rule-2:#343941;
  --amber:#F2A63C;
  --accent:#57C4F2;
  --green:#4FB894;
  --pick:#25A2B1;   --pick-bg:#10333A;  --pick-fg:#7FDCE8;
  --dep:#9575EC;    --dep-bg:#251E3E;   --dep-fg:#C6B1FF;
  --sig-blue:#3C9ED2;
  --sig-orange:#C87C2E;
  --sig-green:#3DA35F;
  --sig-red:#D9544A;
  --sig-gray:#868C94;
  --chip-fg:#12141A;
  --th-bg:#1F232A;  --th-fg:#C9CFD6;
  --ok-bg:#16302A;  --ok-fg:#74D6AE;
  --go-bg:#10303F;  --go-fg:#72C9EE;
  --wait-bg:#3A2C12;--wait-fg:#EBB763;
  --bad-bg:#3B1D18; --bad-fg:#F2958A;
  --row-hover:#20242A;
  --invert-bg:#0E0F12; --invert-fg:#E9ECEF;
  --mark-fg:#15171C;
  --wm:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 32px -22px rgba(0,0,0,.95);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-display);font-size:16px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ---------- barra (no se imprime) ---------- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:16px clamp(18px,4vw,40px);border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--paper);z-index:10;
}
.bar-left{display:flex;align-items:center;gap:10px}
.bar svg{width:26px;height:26px;display:block;flex:none}
.bar .word{font-weight:700;font-size:20px;letter-spacing:-.035em}
.bar-right{display:flex;align-items:center;gap:10px}
.mini{
  display:inline-flex;align-items:center;white-space:nowrap;
  font-family:var(--f-display);font-size:15px;font-weight:500;letter-spacing:normal;
  text-decoration:none;border:2px solid var(--ink);color:var(--ink);border-radius:999px;
  height:46px;padding:0 20px;cursor:pointer;background:var(--sheet);line-height:1;
  transition:background-color .15s var(--ease),color .15s var(--ease),transform .08s var(--ease);
}
.mini:hover{background:var(--ink);color:var(--off)}
.mini:active{transform:scale(.98)}
.mini.solid{background:var(--ink);color:var(--off);border-color:transparent}
.mini.solid:hover{background:var(--ink-2)}

/* ---------- hoja ---------- */
.wrap{padding:clamp(20px,4vh,44px) clamp(16px,4vw,40px) 90px}
.sheet{
  position:relative;overflow:hidden;
  max-width:840px;margin:0 auto;background:var(--sheet);
  border:1px solid var(--rule);padding:clamp(26px,5vw,58px);
}
.sheet::after{
  content:"MUESTRA";position:absolute;top:44%;left:50%;
  transform:translate(-50%,-50%) rotate(-24deg);
  font-weight:700;font-size:clamp(70px,15vw,150px);letter-spacing:-.04em;
  color:var(--wm,rgba(38,38,42,.05));pointer-events:none;white-space:nowrap;
}
.sheet > *{position:relative;z-index:1}

.doc-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:22px;border-bottom:2px solid var(--ink);
}
.doc-head .id{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.8}
.doc-head .id b{display:block;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:.02em}
.issuer{display:flex;align-items:center;gap:10px}
.issuer svg{width:28px;height:28px;display:block}
.issuer .word{font-weight:700;font-size:21px;letter-spacing:-.035em;display:block}
.issuer .sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-top:2px}

h1{font-size:clamp(25px,3.4vw,36px);font-weight:700;letter-spacing:-.035em;line-height:1.08;margin:28px 0 0}
.kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 20px;display:block}

.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:30px}
@media (max-width:640px){.meta{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.meta{grid-template-columns:1fr}}
.meta > div{background:var(--sheet);padding:16px 18px}
.meta dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.meta dd{margin:0;font-size:16px;font-weight:600;letter-spacing:-.015em}

h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:38px 0 0}
.tw{overflow-x:auto;margin-top:14px;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th{
  font-family:var(--f-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--rule-hard);
  white-space:nowrap;background:var(--paper);
}
td{padding:12px 16px;border-bottom:1px solid var(--rule);color:var(--ink-2)}
tr:last-child td{border-bottom:none}
td.mono{font-family:var(--f-mono);font-size:13px;white-space:nowrap;color:var(--ink)}
td.n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);width:34px}
td.lead{color:var(--ink);font-weight:600}

.cond{
  display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;
  padding:5px 13px;border-radius:999px;white-space:nowrap;background:var(--paper);color:var(--ink-2);
}
.cond.good{background:var(--ok-bg);color:var(--ok-fg)}
.cond.fair{background:var(--wait-bg);color:var(--wait-fg)}
.cond.out{background:var(--paper-2,#EBEDF0);color:var(--ink-2)}

.meta dd.id{font-family:var(--f-mono);font-size:15px;letter-spacing:.02em}
.type{
  display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;
  padding:4px 12px;border-radius:999px;white-space:nowrap;
}
.type::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.type.pickup{background:var(--pick-bg);color:var(--pick-fg)}
.type.deploy{background:var(--dep-bg);color:var(--dep-fg)}

/* separaciones más marcadas */
.sheet{border:1px solid var(--rule-2);box-shadow:var(--shadow)}
.meta{border-color:var(--rule-2)}
.tw{border-color:var(--rule-2)}
th{border-bottom:2px solid var(--rule-2);color:var(--ink-2)}
tbody tr:nth-child(even) td{background:var(--paper)}

.decl{margin-top:30px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.decl p{margin:0 0 12px;max-width:78ch}
.attach{
  margin-top:18px;padding:14px 18px;background:var(--paper);border-left:3px solid var(--accent);
  font-size:14px;color:var(--ink-2);
}

.signs{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:40px}
@media (max-width:640px){.signs{grid-template-columns:1fr}}
.sign{border-top:1px solid var(--rule-hard);padding-top:14px}
.sign .ink{height:64px;display:flex;align-items:flex-end;margin-bottom:6px}
.sign .ink svg{width:180px;height:56px;color:var(--ink)}
.sign .who{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.sign .role{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sign .stamp{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:10px;line-height:1.7;word-break:break-all}

.foot{margin-top:42px;padding-top:18px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);line-height:1.65}

.missing{max-width:640px;margin:70px auto;text-align:center}
.missing h1{margin-bottom:14px}

/* ---------- móvil ---------- */
@media (max-width:640px){
  .bar{padding:12px 16px;gap:9px}
  .bar-right{width:100%;gap:8px;flex-wrap:wrap}
  .bar-right .mini{flex:1 1 auto;min-width:0;justify-content:center;height:44px;padding:0 12px;font-size:14px}
  .bar-right #lang,.bar-right .iconbtn{flex:0 0 auto}
  .bar-right .mini.solid{flex:1 1 100%}
  table{min-width:0;font-size:13px}
  th,td{padding:9px 10px}
  td.n,th:first-child{display:none}
  .sign .ink svg{width:150px}
}

/* ---------- impresión ---------- */
@media print{
  @page{size:letter portrait;margin:14mm}
  /* el acta se imprime siempre en claro, sin importar el tema de pantalla */
  :root,:root[data-theme="dark"]{
    --paper:#fff; --paper-2:#F3F2EF; --sheet:#fff; --off:#fff;
    --ink:#1A1A1C; --ink-2:#3C3C40; --muted:#6A6A64;
    --rule:#D3CFC7; --rule-hard:#B9B4AA; --rule-2:#B9B4AA;
    --pick-bg:#DCEFF1; --pick-fg:#0A6C77; --dep-bg:#E7E1FA; --dep-fg:#4F31A8;
    --ok-bg:#DCEDE5; --ok-fg:#256B51; --wait-bg:#FAE6C4; --wait-fg:#87590C;
    --wm:rgba(38,38,42,.06); --shadow:none;
  }
  .bar,.wrap{padding:0}
  .bar{display:none}
  body{background:#fff;font-size:12.5px}
  .sheet{max-width:none;margin:0;border:none;padding:0;background:#fff}
  .sheet::after{color:rgba(38,38,42,.06)}
  .meta > div,th{background:#fff}
  .attach{background:#f5f5f4}
  h1{font-size:25px}
  table{min-width:0;font-size:12px}
  th,td{padding:7px 10px}
  .signs{margin-top:26px;break-inside:avoid}
  .foot{margin-top:24px}
  tr,.sign{break-inside:avoid}
}
.iconbtn{width:46px;padding:0;display:inline-grid;place-items:center;border-radius:50%;flex:0 0 auto}
@media print{.iconbtn{display:none}}

/* ================= paleta de señal =================
   Plano y saturado en vez de pastel: los estados son bloques de color
   con tipografía mono en versales, esquina recta y texto de alto contraste.
   La pareja recolección / despliegue pasó el validador en claro y en oscuro. */
.badge,.type,.cond{
  display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;
  min-width:132px;padding:4px 11px;border-radius:4px;
  font-family:var(--f-display);font-size:13.5px;font-weight:500;
  letter-spacing:normal;text-transform:none;line-height:1.35;
  background:transparent;color:var(--ink-2);border:1px solid var(--rule-2);
}
.badge::before,.type::before,.cond::before{
  content:"";display:block;width:7px;height:7px;border-radius:50%;
  flex:none;background:var(--sig-gray);
}
.badge .gl{display:none}

/* el tipo va sin caja: la fila ya lleva su barra de color */
.type{border:0;padding-left:0;padding-right:0;min-width:124px;color:var(--ink)}
.type.pickup{background:transparent;color:var(--ink)}
.type.pickup::before{background:var(--sig-blue)}
.type.deploy{background:transparent;color:var(--ink)}
.type.deploy::before{background:var(--sig-orange)}

/* estados: contorno del color, texto del color, sin relleno */
.badge.ok,.cond.good{background:transparent;color:var(--sig-green);border-color:currentColor}
.badge.ok::before,.cond.good::before{background:currentColor}
.badge.go{background:transparent;color:var(--sig-blue);border-color:currentColor}
.badge.go::before{background:currentColor}
.badge.wait,.cond.fair{background:transparent;color:var(--sig-orange);border-color:currentColor}
.badge.wait::before,.cond.fair::before{background:currentColor}
.cond.out{background:transparent;color:var(--sig-gray);border-color:currentColor}
.cond.out::before{background:currentColor}

/* lo único que grita es lo vencido */
.badge.bad{background:var(--sig-red);color:var(--chip-fg);border-color:transparent;font-weight:600}
.badge.bad::before{background:#fff}

/* sin sombras suaves: la jerarquía la dan las reglas y el peso */
.tw,.panel,.kpis,.sheet{box-shadow:none}
.tw,.panel,.kpis{border:1px solid var(--rule-2)}

/* cabecera de tabla en negativo, como una herramienta de verdad */
th{background:var(--th-bg);color:var(--th-fg);border-bottom:0;font-weight:600;letter-spacing:.13em}

/* el borde de color de la fila se engrosa y usa la paleta de señal */
tbody tr td:first-child{box-shadow:inset 4px 0 0 var(--rule-hard)}
tbody tr.k-pickup td:first-child{box-shadow:inset 4px 0 0 var(--sig-blue)}
tbody tr.k-deploy td:first-child{box-shadow:inset 4px 0 0 var(--sig-orange)}

.kpi{border-top-width:4px}

.attach{border-left-color:var(--sig-blue)}
.doc-head{border-bottom-color:var(--ink)}
@media print{ th{background:#1A1A1C;color:#fff} }
</style>

if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

    footNote:{
      es:'Documento generado automáticamente por Zarpa. La firma electrónica simple que consta en esta acta tiene valor probatorio según la evidencia que la acompaña — marca de tiempo, ubicación de la visita y fotografías del estado del equipo. Este es un documento de muestra: los datos no corresponden a ninguna persona ni empresa real.',
      en:'Document generated automatically by Zarpa. The simple electronic signature recorded here carries evidentiary weight together with the evidence attached to it — timestamp, visit location and photographs of the equipment condition. This is a sample document: the data does not correspond to any real person or company.'
    },
    notFound:{es:'No encontramos esa acta.', en:'We could not find that record.'},
    notFoundP:{es:'El folio no existe o el movimiento todavía no se ha cerrado.', en:'The reference does not exist or the movement has not been closed yet.'},
    back:{es:'Volver al panel', en:'Back to dashboard'}
  };

  var lang = 'es';
  try { lang = localStorage.getItem('lang') === 'en' ? 'en' : 'es'; } catch(e){}
  function t(k){ return (T[k] && T[k][lang]) || k; }

  function fmtDate(iso){
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(lang === 'en' ? 'en-US' : 'es-CR',
      { day:'2-digit', month:'long', year:'numeric' });
  }
  function fmtStamp(iso){
    return fmtDate(iso) + ' · ' + (lang === 'en' ? '11:42 a.m. (UTC-6)' : '11:42 a. m. (UTC-6)');
  }
  /* huella estable a partir del folio: no es criptografía, es continuidad visual */
  function hash(seed){
    var h = 2166136261, out = '';
    for (var i = 0; i < seed.length; i++){ h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
    for (var j = 0; j < 8; j++){ h = (h * 16777619 + j) >>> 0; out += ('0000000' + h.toString(16)).slice(-8); }
    return out.slice(0, 64);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function squiggle(seed){
    var n = 0; for (var i = 0; i < seed.length; i++) n += seed.charCodeAt(i);
    var a = 8 + (n % 9), b = 30 + (n % 17), c = 12 + (n % 11);
    return '<svg viewBox="0 0 180 56" fill="none" stroke="currentColor" stroke-width="2.2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M6 ' + (40 - a) + ' C 26 ' + (6 + c) + ', 40 ' + (48 - c) + ', 58 ' + (26 + a) +
      ' S 84 ' + (8 + a) + ', 98 ' + (34 - c) + ' S 126 ' + (b + 6) + ', 146 ' + (18 + c) +
      ' S 166 ' + (34 - a) + ', 174 ' + (26 + c) + '"/>' +
      '<path d="M40 46 L150 44"/></svg>';
  }

  var LOGO =
    '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">' +
    '<ellipse cx="7.5" cy="10.5" rx="3" ry="4" fill="currentColor"/>' +
    '<ellipse cx="15.2" cy="7.6" rx="3.1" ry="4.3" fill="currentColor"/>' +
    '<ellipse cx="23" cy="10.5" rx="3" ry="4" fill="currentColor"/>' +
    '<rect x="6.5" y="16.6" width="19" height="11.4" rx="4" fill="var(--accent)"/>' +
    '<path d="M16 16.6v11.4M6.5 21.5h19" stroke="var(--sheet)" stroke-width="1.7"/>' +
    '</svg>';

  function folioFromUrl(){
    var m = /[?&]f=([^&]+)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function render(){
    var out = document.getElementById('out');
    var mv = window.ZARPA.byFolio(folioFromUrl());

    document.documentElement.lang = lang;
    document.getElementById('lang').textContent = lang === 'en' ? 'ES' : 'EN';
    Array.prototype.forEach.call(document.querySelectorAll('[data-en]'), function(el){
      if (!el.hasAttribute('data-es')) el.setAttribute('data-es', el.innerHTML);
      el.innerHTML = el.getAttribute(lang === 'en' ? 'data-en' : 'data-es');
    });

    if (!mv || !mv.items){
      document.title = t('notFound') + ' · Zarpa';
      out.innerHTML =
        '<div class="missing"><h1>' + t('notFound') + '</h1>' +
        '<p>' + t('notFoundP') + '</p>' +
        '<a class="mini" href="dashboard.html" style="margin-top:14px">' + t('back') + '</a></div>';
      return;
    }

    document.title = t('title') + ' ' + mv.f + ' · Zarpa';
    var person = t('personN') + ' ' + mv.p;
    var courier = t('courierN') + ' ' + mv.courier;

    var rows = mv.items.map(function(it, i){
      return '<tr>' +
        '<td class="n">' + ('0' + (i + 1)).slice(-2) + '</td>' +
        '<td class="mono">' + esc(it.sn) + '</td>' +
        '<td class="lead">' + esc(lang === 'en' && it.en ? it.en : it.it) + '</td>' +
        '<td><span class="cond ' + it.c + '">' + t(it.c) + '</span></td>' +
      '</tr>';
    }).join('');

    out.innerHTML =
      '<div class="sheet">' +
        '<div class="doc-head">' +
          '<div class="issuer">' + LOGO +
            '<span><span class="word">Zarpa</span>' +
            '<span class="sub">' + t('issuer') + '</span></span>' +
          '</div>' +
          '<div class="id"><b>' + esc(mv.f) + '</b>' +
            t('issued') + ' ' + fmtDate(mv.d) + '</div>' +
        '</div>' +

        '<h1>' + t('title') + '</h1>' +

        '<dl class="meta">' +
          '<div><dt>' + t('company') + '</dt><dd>' + esc(window.ZARPA.company[lang]) + '</dd></div>' +
          '<div><dt>' + t('person') + '</dt><dd>' + person + '</dd></div>' +
          '<div><dt>' + t('ced') + '</dt><dd class="id">' + window.ZARPA.ced(mv.p) + '</dd></div>' +
          '<div><dt>' + t('type') + '</dt><dd><span class="type ' + mv.k + '">' + t(mv.k) + '</span></dd></div>' +
          '<div><dt>' + t('date') + '</dt><dd>' + fmtDate(mv.d) + '</dd></div>' +
          '<div><dt>' + t('zone') + '</dt><dd>' + esc(mv.z) + '</dd></div>' +
          '<div><dt>' + t('courier') + '</dt><dd>' + courier + '</dd></div>' +
        '</dl>' +

        '<h2>' + t('items') + '</h2>' +
        '<div class="tw"><table>' +
          '<thead><tr><th>' + t('thN') + '</th><th>' + t('thSn') + '</th>' +
          '<th>' + t('thIt') + '</th><th>' + t('thC') + '</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>' +
        '<p class="foot" style="margin-top:12px;padding:0;border:0">' +
          mv.items.length + ' ' + t('count') + '</p>' +

        '<h2>' + t('declTitle') + '</h2>' +
        '<div class="decl"><p>' + (mv.k === 'pickup' ? t('declPick') : t('declDep')) + '</p></div>' +
        '<div class="attach">' + t('attach') + '</div>' +

        '<div class="signs">' +
          '<div class="sign">' +
            '<div class="ink">' + squiggle(mv.f + mv.p) + '</div>' +
            '<div class="who">' + person + '</div>' +
            '<div class="role">' + t('roleP') + ' · ' + t('ced') + ' ' + window.ZARPA.ced(mv.p) + '</div>' +
            '<div class="stamp">' + t('signedBy') + '<br>' + fmtStamp(mv.d) +
              '<br>' + hash(mv.f + ':' + mv.p) + '</div>' +
          '</div>' +
          '<div class="sign">' +
            '<div class="ink">' + squiggle(mv.f + 'c' + mv.courier) + '</div>' +
            '<div class="who">' + courier + '</div>' +
            '<div class="role">' + t('roleC') + '</div>' +
            '<div class="stamp">' + t('signedBy') + '<br>' + fmtStamp(mv.d) +
              '<br>' + hash(mv.f + ':c' + mv.courier) + '</div>' +
          '</div>' +
        '</div>' +

        '<p class="foot">' + t('footNote') + '</p>' +
      '</div>';
  }

  document.getElementById('lang').addEventListener('click', function(){
    lang = lang === 'en' ? 'es' : 'en';
    try { localStorage.setItem('lang', lang); } catch(e){}
    render();
  });
  document.getElementById('print').addEventListener('click', function(){ window.print(); });

  render();
})();
</script>

<script>
/* tema claro / oscuro: la preferencia del sistema manda hasta que el usuario elige */
(function(){
  var root = document.documentElement, btn = document.getElementById('theme');
  if (!btn) return;
  function current(){
    return root.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function apply(t){
    root.setAttribute('data-theme', t);
    btn.setAttribute('aria-pressed', String(t === 'dark'));
    btn.title = t === 'dark' ? 'Modo claro / light mode' : 'Modo oscuro / dark mode';
    try { localStorage.setItem('theme', t); } catch(e){}
  }
  btn.addEventListener('click', function(){ apply(current() === 'dark' ? 'light' : 'dark'); });
  btn.setAttribute('aria-pressed', String(current() === 'dark'));
  btn.title = current() === 'dark' ? 'Modo claro / light mode' : 'Modo oscuro / dark mode';
})();
</script>
</body>
</html>
